version: '3.8'

services:
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    container_name: fast_api_app_container
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    devices:
      - "/dev/video0:/dev/video0"  # Webcam access (facultatif si nécessaire)
    networks:
      - eula_net

  django:
    build:
      context: .
      dockerfile: Dockerfile.django
    container_name: django_app_container
    ports:
      - "8001:8001"
    depends_on:
      - fastapi
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    environment:
      - GROQ_API_KEY=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
      - NVIDIA_VISIBLE_DEVICES=all
    networks:
      - eula_net

  nginx:
    image: nginx:latest
    container_name: nginx_reverse_proxy
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - django
    networks:
      - eula_net

networks:
  eula_net:
    driver: bridge
