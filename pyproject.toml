[project]
name = "eula-vaaag"
version = "0.1.0"
description = "Ecriver une lettre à votre arrière arrière arrière grand-mère"
authors = [
    {name = "Malek BOUMEDINE",email = "malek.boumedine@gmail.com"},
    {name = "istaion",email = "v.poutot@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas (>=2.3.0,<3.0.0)",
    "scikit-learn (>=1.7.0,<2.0.0)",
    "torch (>=2.0.0,<3.0.0)",
    "tensorflow (>=2.19.0,<3.0.0)",
    "ipykernel (>=6.29.5,<7.0.0)",
    "pyarrow (>=20.0.0,<21.0.0)",
    "sentencepiece (>=0.2.0,<0.3.0)",
    "tf-keras (>=2.19.0,<3.0.0)",
    "accelerate (>=1.7.0,<2.0.0)",
    "sacrebleu (>=2.5.1,<3.0.0)",
    "rouge-score (>=0.1.2,<0.2.0)",
    "nltk (>=3.9.1,<4.0.0)",
    "transformers (>=4.52.4,<5.0.0)",
    "datasets (>=3.6.0,<4.0.0)",
    "gradio (>=5.34.1,<6.0.0)"
    "dotenv (>=0.9.9,<0.10.0)",
    "openai (>=1.88.0,<2.0.0)",
    "matplotlib (>=3.10.3,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
