[project]
name = "eula-vaaag"
version = "0.1.0"
description = "Ecriver une lettre à votre arrière arrière arrière grand-mère"
authors = [
    {name = "Malek BOUMEDINE",email = "malek.boumedine@gmail.com"},
    {name = "istaion",email = "v.poutot@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas (>=2.3.0,<3.0.0)",
    "scikit-learn (>=1.7.0,<2.0.0)",
    "torch (>=1.0.2,<2.0.0)",
    "tensorflow (>=2.19.0,<3.0.0)",
    "ipykernel (>=6.29.5,<7.0.0)",
    "pyarrow (>=20.0.0,<21.0.0)",
    "nltk (>=3.9.1,<4.0.0)"
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
